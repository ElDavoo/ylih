version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      android-dependencies:
        patterns:
          - "*"
    ignore:
      # Held at 1.5.0-alpha25 by hand, for the reason libs.versions.toml states at the pin:
      # every release after it carries a material3-ripple-android with minSdk 24, which fails
      # the manifest merge against this app's minSdk 23 floor. Dependabot cannot read that
      # comment, so it raised the same unmergeable PR every Monday and dragged three healthy
      # bumps down with it -- a grouped PR is one merge or none. Advancing this is a decision
      # about the floor, not a version bump, so it stays a human one.
      - dependency-name: "androidx.compose.material3:material3"

  # flake.lock only — the nixpkgs/flake-utils inputs. The pinned build-tools and
  # platform versions inside flake.nix are duplicated in libs.versions.toml and the
  # CI workflow, so Dependabot cannot touch those; it just moves the lock forward.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      nix-inputs:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
