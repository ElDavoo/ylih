version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      android-dependencies:
        patterns:
          - "*"
    ignore:
      # Held at 1.5.0-alpha25 by hand, for the reason libs.versions.toml states at the pin.
      # The original objection -- every release after it carries a material3-ripple-android with
      # minSdk 24, which failed the manifest merge against a minSdk 23 floor -- no longer holds:
      # the floor is 26. What keeps the ignore here is that lifting the pin also means
      # regenerating gradle/verification-metadata.xml, which Dependabot cannot do, so the weekly
      # grouped PR would still be unmergeable and would drag three healthy bumps down with it --
      # a grouped PR is one merge or none. Remove this entry in the same change that unpins.
      - dependency-name: "androidx.compose.material3:material3"

  # flake.lock only — the nixpkgs/flake-utils inputs. The pinned build-tools and
  # platform versions inside flake.nix are duplicated in libs.versions.toml and the
  # CI workflow, so Dependabot cannot touch those; it just moves the lock forward.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      nix-inputs:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
