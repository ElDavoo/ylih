name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # The `secrets` context is not available in a step-level `if:`, which makes the whole
      # workflow file invalid rather than just skipping the step. Lifting it into `env` here
      # gives the steps below something they are allowed to test.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Cache Android SDK components
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-37.0
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/37.0.0
          key: android-sdk-${{ runner.os }}-platform37.0-buildtools37.0.0

      - name: Install Android SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build release artifacts
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ env.KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        # The sideloaded build ships as an APK; the store build ships as a bundle, which is
        # what Play Console accepts.
        run: ./gradlew --no-daemon --stacktrace clean assembleClassicRelease bundlePlayRelease

      # F-Droid's AllowedAPKSigningKeys wants the SHA-256 of the signing certificate as lowercase
      # hex with no colons, which is exactly what apksigner prints. Emitting it here means the
      # recipe can be filled in from a job log rather than from whoever is holding the keystore.
      - name: Signing certificate fingerprint
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/classic/release -maxdepth 1 -name '*.apk' | head -1)
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort | tail -1)
          echo "apk=${apk:-<none>} apksigner=${apksigner:-<none>}"
          "$apksigner" verify --print-certs "$apk" | tee /tmp/certs.txt
          # Every line naming a certificate digest, not `Signer #1` specifically: build-tools
          # 37.0.0's apksigner labels the signer by the scheme that carries it ("V2 Signer:",
          # and "V3 Signer:" where a v3 block exists) and prints one line per scheme. They all
          # name the same certificate, so the fingerprint is whatever they agree on.
          digest=$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/certs.txt | sort -u)
          # An empty digest means the pattern has drifted from apksigner's output rather than
          # that the APK is unsigned — apksigner would have exited non-zero for that. More than
          # one means the schemes disagree, which AllowedAPKSigningKeys cannot express. Fail on
          # either, because a silently wrong fingerprint is one that gets noticed at
          # verification time.
          if [ "$(printf '%s' "$digest" | grep -c .)" != 1 ]; then
            echo "::error::expected exactly one certificate SHA-256 in apksigner output (see above)"
            exit 1
          fi
          echo "AllowedAPKSigningKeys: $digest" | tee -a "$GITHUB_STEP_SUMMARY"

      # Screenshots, the 512px icon and the feature graphic, rendered on the JVM by Roborazzi —
      # no emulator involved. Generated from the tagged commit so the store listing can never
      # show a version other than the one being released. See docs/play-store.md.
      - name: Generate Play listing assets
        run: ./gradlew --no-daemon --stacktrace recordRoborazziPlayReleaseTest

      - name: Upload Play listing assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: play-listing-assets
          path: app/build/outputs/play-listing/**/*.png
          if-no-files-found: error

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p dist

          classic_apk=$(find app/build/outputs/apk/classic/release -name "*.apk" | head -1)
          if [ -z "$classic_apk" ]; then
            echo "No classic release APK found" >&2
            exit 1
          fi
          case "$classic_apk" in
            *unsigned*) cp "$classic_apk" "dist/ylih-${RELEASE_TAG}-classic-unsigned.apk" ;;
            *) cp "$classic_apk" "dist/ylih-${RELEASE_TAG}-classic.apk" ;;
          esac

          play_aab=$(find app/build/outputs/bundle -name "*.aab" | head -1)
          if [ -z "$play_aab" ]; then
            echo "No Play bundle found" >&2
            exit 1
          fi
          cp "$play_aab" "dist/ylih-${RELEASE_TAG}-play.aab"

          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
          generate_release_notes: true
