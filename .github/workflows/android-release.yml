name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android SDK components
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-37.0
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/37.0.0
          key: android-sdk-${{ runner.os }}-platform37.0-buildtools37.0.0

      - name: Install Android SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Decode signing keystore
        if: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build release artifacts
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        # The sideloaded build ships as an APK; the store build ships as a bundle, which is
        # what Play Console accepts.
        run: ./gradlew --no-daemon --stacktrace clean assembleClassicRelease bundlePlayRelease

      # Screenshots, the 512px icon and the feature graphic, rendered on the JVM by Roborazzi —
      # no emulator involved. Generated from the tagged commit so the store listing can never
      # show a version other than the one being released. See docs/play-store.md.
      - name: Generate Play listing assets
        run: ./gradlew --no-daemon --stacktrace recordRoborazziPlayDebug

      - name: Upload Play listing assets
        uses: actions/upload-artifact@v7
        with:
          name: play-listing-assets
          path: app/build/outputs/play-listing/**/*.png
          if-no-files-found: error

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p dist

          classic_apk=$(find app/build/outputs/apk/classic/release -name "*.apk" | head -1)
          if [ -z "$classic_apk" ]; then
            echo "No classic release APK found" >&2
            exit 1
          fi
          case "$classic_apk" in
            *unsigned*) cp "$classic_apk" "dist/ylih-${RELEASE_TAG}-classic-unsigned.apk" ;;
            *) cp "$classic_apk" "dist/ylih-${RELEASE_TAG}-classic.apk" ;;
          esac

          play_aab=$(find app/build/outputs/bundle -name "*.aab" | head -1)
          if [ -z "$play_aab" ]; then
            echo "No Play bundle found" >&2
            exit 1
          fi
          cp "$play_aab" "dist/ylih-${RELEASE_TAG}-play.aab"

          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
          generate_release_notes: true
