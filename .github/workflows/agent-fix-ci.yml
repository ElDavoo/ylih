name: Agent · fix CI

# Red-CI leg of the loop: Android CI failed on an agent branch; gather the failure and hand it
# to the shared fix stage (docs/agent-pipeline.md).
#
# `workflow_run`, not a PR check, since the logs exist only once the run finishes. Runs in the
# default branch's context, so secrets are safe: the executing file is main's, never the branch
# being fixed.

on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
    # Filtered here, not only in `context`'s `if:`, since a fully-skipped run still holds the
    # pipeline-wide concurrency group's one pending slot from this workflow's first job.
    # Unfiltered, an Android CI run on main (one per push) could bump a pending Agent · review
    # and strand auto-merge on a check that never reports. `if:` still matters — it can't filter
    # on conclusion, so a green CI run on an agent branch still arrives and skips.
    branches: ['agent/issue-*']

# Granted per job, not here, since a workflow-level block would give the gate the same token as
# the agent stage — the gate's job is deciding whether the agent runs at all.
permissions: {}

# The pipeline-wide serial group; agent-plan.yml has the reasoning. It's at workflow level, not
# on the `fix` job, since the shared stage is a reusable workflow running inside this run — the
# run must hold the slot, and agent-fix.yml must not request the group again. Holding it from
# `context` on costs a minute of queue on a log-gathering step, keeping the reservation in one
# place.
concurrency:
  group: agent-pipeline
  cancel-in-progress: false

jobs:
  context:
    permissions:
      contents: read
      actions: read
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && startsWith(github.event.workflow_run.head_branch, 'agent/issue-')
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.find.outputs.pr }}
      issue: ${{ steps.find.outputs.issue }}
      author: ${{ steps.find.outputs.author }}
      logs: ${{ steps.logs.outputs.text }}
      go: ${{ steps.find.outputs.go }}

    steps:
      - name: Find the pull request and the issue behind it
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          issue=${BRANCH#agent/issue-}
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "::notice::No open pull request for $BRANCH — nothing to fix."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Leave a stuck, stopped, or draft branch alone: drafting hands a branch to a human,
          # and picking it back up would undo that.
          state=$(gh pr view "$pr" --json isDraft,labels --jq '[(.isDraft|tostring)] + [.labels[].name] | join(",")')
          case ",$state," in
            *,true,*|*,agent:stop,*|*,agent:stuck,*)
              echo "::notice::PR #$pr is draft or stopped — leaving it alone."
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          author=$(gh issue view "$issue" --json author --jq .author.login)
          {
            echo "pr=$pr"
            echo "issue=$issue"
            echo "author=$author"
            echo "go=true"
          } >> "$GITHUB_OUTPUT"

      - name: Collect the failed job logs
        id: logs
        if: steps.find.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          # Truncated to the tail: a workflow_call input is a string on the event payload, far
          # smaller than a full Gradle log. The tail holds the failure; the head is SDK downloads.
          gh run view "$RUN_ID" --log-failed 2>/dev/null | tail -c 30000 > /tmp/failed.log || true
          if [ ! -s /tmp/failed.log ]; then
            printf 'Could not download the failed job logs. Run: %s\n' "$RUN_URL" > /tmp/failed.log
          fi
          {
            printf 'text<<CI_LOG_EOF\n'
            cat /tmp/failed.log
            printf '\nCI_LOG_EOF\n'
          } >> "$GITHUB_OUTPUT"

  fix:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    needs: [context]
    if: needs.context.outputs.go == 'true'
    uses: ./.github/workflows/agent-fix.yml
    secrets:
      AGENT_PUSH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      pr: ${{ needs.context.outputs.pr }}
      issue: ${{ needs.context.outputs.issue }}
      author: ${{ needs.context.outputs.author }}
      reason: ci
      payload: ${{ needs.context.outputs.logs }}
