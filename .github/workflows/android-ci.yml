name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Store listing text is the one part of the app that no compiler or lint check reads, and
  # both F-Droid and Play truncate it silently rather than rejecting it. Cheap to check, and
  # it needs no JDK or SDK, so it runs on its own rather than twice inside the flavor matrix.
  listing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check store listing metadata
        run: >
          python3 .github/scripts/listing-metadata-check.py
          fastlane/metadata/android
          "$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)"

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # `flavor` is the Gradle source-set name, `variant` its capitalised task-name form.
          - flavor: classic
            variant: Classic
          - flavor: play
            variant: Play

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android SDK components
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-37.0
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/37.0.0
          key: android-sdk-${{ runner.os }}-platform37.0-buildtools37.0.0

      - name: Install Android SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Dependencies and the Gradle build cache are restored on every run; only builds of
          # the default branch write them back, so PRs cannot poison the shared cache.
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v6
        with:
          # Robolectric downloads a ~100 MB runtime jar per simulated SDK on first use.
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      # ReleaseTest rather than Debug because that is the build type `testBuildType` puts both
      # test source sets on — so it is the variant whose lint sees src/test and src/androidTest,
      # and the one that has unit tests to measure coverage over at all. The two assemble tasks
      # are still Debug and Release: those are the artifacts anyone ships or installs.
      #
      # create<Variant>UnitTestCoverageReport runs the unit tests and then the JaCoCo report over
      # them, so it stands in for test<Variant>UnitTest rather than adding a second run.
      - name: Build and test (${{ matrix.flavor }})
        run: >
          ./gradlew --no-daemon --stacktrace
          lint${{ matrix.variant }}ReleaseTest
          create${{ matrix.variant }}ReleaseTestUnitTestCoverageReport
          assemble${{ matrix.variant }}Debug
          assemble${{ matrix.variant }}Release

      # The release build is the only one R8 touches, and no test in the suite runs minified
      # code — so this is the only place a stripped or renamed reflective entry point can be
      # caught before a device finds it. Reads the mapping.txt the assemble step just wrote.
      - name: Check R8 keep invariants (${{ matrix.flavor }})
        run: >
          python3 .github/scripts/r8-keep-check.py
          app/build/outputs/mapping/${{ matrix.flavor }}Release

      # Also the gate. Instruction and line sit just under where the suite actually is — 96.4 and
      # 99.6 — so they catch a regression without tracking noise. Branch is held further back, at
      # 70 against an actual 75.7, deliberately: the Compose compiler emits a $changed bitmask
      # branch for every composable parameter and no test drives those, so the number moves when
      # a composable gains an argument rather than when testing gets worse. A floor that close to
      # the line would report that as a coverage failure. See the script's docstring.
      - name: Report coverage (${{ matrix.flavor }})
        if: always()
        run: >
          python3 .github/scripts/coverage-summary.py
          app/build/reports/coverage/test/${{ matrix.flavor }}/releaseTest/report.xml
          ${{ matrix.flavor }}
          --min-instruction=95
          --min-line=99
          --min-branch=70

      - name: Build Play bundle
        if: matrix.flavor == 'play'
        run: ./gradlew --no-daemon --stacktrace bundlePlayRelease

      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.flavor }}-artifacts
          path: |
            app/build/outputs/apk/${{ matrix.flavor }}/**/*.apk
            app/build/outputs/bundle/**/*.aab
            app/build/reports/**

  # The only job that runs the code a user actually gets. Unit tests execute on the JVM against
  # unshrunk classes, so R8 never runs for them; the releaseTest build type is release plus the
  # test manifest, so androidTest installs a genuinely minified, resource-shrunk APK — which
  # needs a real Android runtime. Hence an emulator, and hence a job of its own: it is far slower
  # than the rest of CI and fails for its own reasons.
  #
  # Only the classic flavor. The flavors differ by compile-time constants in Distribution.kt and
  # one manifest overlay, not by anything R8 sees, so running both would double the slowest job
  # in the workflow to re-test identical shrinking.
  instrumented:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android SDK components
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-37.0
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/37.0.0
          key: android-sdk-${{ runner.os }}-platform37.0-buildtools37.0.0

      - name: Install Android SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      # The runner image ships KVM but leaves it root-only, and without acceleration the emulator
      # is slow enough to make this job useless.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # releaseTest inherits release's signing config, and a release build with no
      # ANDROID_SIGNING_* in the environment is deliberately left unsigned — that is what keeps
      # the F-Droid build reproducible, see docs/fdroid.md — while an unsigned APK will not
      # install. So the job makes a key it throws away. AGP signs the androidTest APK with the
      # tested variant's config, so both sides match and the instrumentation is allowed to attach
      # to the app's process; the real signing key is never involved.
      - name: Generate a throwaway signing key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/instrumented.keystore" \
            -storepass instrumented -keypass instrumented -alias instrumented \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname 'CN=ylih instrumented tests, O=throwaway'

      - name: Instrumented tests on the minified APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/instrumented.keystore
          ANDROID_SIGNING_STORE_PASSWORD: instrumented
          ANDROID_SIGNING_KEY_ALIAS: instrumented
          ANDROID_SIGNING_KEY_PASSWORD: instrumented
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: >
            ./gradlew --no-daemon --stacktrace
            connectedClassicReleaseTestAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
