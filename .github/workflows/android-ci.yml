name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # A run that was never created cannot be re-run, and Actions does not backfill. The outage on
  # 2026-08-06 swallowed run creation for a push to main outright — no queued run, no failed run,
  # nothing — which left no way to ask for the checks again short of pushing a commit that changed
  # nothing. `android-release.yml` had this trigger and was recoverable; this one did not.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Store listing text is the one part of the app that no compiler or lint check reads, and
  # both F-Droid and Play truncate it silently rather than rejecting it. Cheap to check, and
  # it needs no JDK or SDK, so it runs on its own rather than twice inside the flavor matrix.
  listing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check store listing metadata
        run: >
          python3 .github/scripts/listing-metadata-check.py
          fastlane/metadata/android
          "$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)"

      # The other thing nothing reads: compileSdk and buildToolsVersion are written down in five
      # files and only a comment asked anyone to keep them in step. Bumping one and not the rest
      # does not fail — AGP downloads what is missing — it just quietly costs a download per run.
      - name: Check the SDK versions agree everywhere
        run: python3 .github/scripts/sdk-version-check.py

      # The agent pipeline is six workflow files whose only test is running them, and a mistake
      # in one is discovered by an issue quietly doing nothing. actionlint is the closest thing
      # to a compiler they have: it type-checks every ${{ }} expression against the event
      # payload, and runs shellcheck over each `run:` block — which is how the truncation an
      # unquoted ` #` causes in a plain YAML scalar was caught here rather than at 2am.
      #
      # Downloaded rather than taken from an action, and pinned by checksum, for the reason
      # CLAUDE.md gives for the Gradle distribution and the dependency metadata: an unverified
      # download is an unverified input.
      - name: Check the workflows
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_SHA256: dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

          # zizmor covers what actionlint has no opinion about: unpinned actions, permissions
          # wider than a job needs, credentials left in .git/config, caches a release should not
          # trust. --offline because the online audits agree here and a gate that needs a token
          # and the network fails for reasons of its own.
          curl -fsSL -o /tmp/zizmor.tar.gz \
            https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "${ZIZMOR_SHA256}  /tmp/zizmor.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zizmor.tar.gz -C /tmp zizmor
          /tmp/zizmor --offline --color=always .github/workflows/

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # `flavor` is the Gradle source-set name, `variant` its capitalised task-name form.
          - flavor: classic
            variant: Classic
          - flavor: play
            variant: Play

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Cache Android SDK components
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-37.0
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/37.0.0
          key: android-sdk-${{ runner.os }}-platform37.0-buildtools37.0.0

      - name: Install Android SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Dependencies and the Gradle build cache are restored on every run; only builds of
          # the default branch write them back, so PRs cannot poison the shared cache.
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Cache Robolectric android-all jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Robolectric downloads a ~100 MB runtime jar per simulated SDK on first use.
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      # Lint is ReleaseTest because that is where `testBuildType` puts src/androidTest, so it is
      # the variant whose lint sees both test source sets. The two assemble tasks are Debug and
      # Release: those are the artifacts anyone ships or installs.
      #
      # create<Variant>UnitTestCoverageReport runs the unit tests and then the JaCoCo report over
      # them, so it stands in for test<Variant>ReleaseTestUnitTest rather than adding a second run.
      #
      # The suite then runs a second time on debug, which it can since
      # android.onlyEnableUnitTestForTheTestedBuildType went off. Not a duplicate: the build type
      # is a compile-time input like any other, and debug differs by BuildConfig.DEBUG, the
      # .debug applicationId suffix and an unshrunk resource table. Uninstrumented, so it costs
      # the run but not the JaCoCo overhead, and the coverage gate below still reads exactly one
      # report — the releaseTest one — rather than trying to reconcile two.
      - name: Build and test (${{ matrix.flavor }})
        run: >
          ./gradlew --no-daemon --stacktrace
          lint${{ matrix.variant }}ReleaseTest
          create${{ matrix.variant }}ReleaseTestUnitTestCoverageReport
          test${{ matrix.variant }}DebugUnitTest
          assemble${{ matrix.variant }}Debug
          assemble${{ matrix.variant }}Release

      # The release build is the only one R8 touches, and no test in the suite runs minified
      # code — so this is the only place a stripped or renamed reflective entry point can be
      # caught before a device finds it. Reads the mapping.txt the assemble step just wrote.
      - name: Check R8 keep invariants (${{ matrix.flavor }})
        run: >
          python3 .github/scripts/r8-keep-check.py
          app/build/outputs/mapping/${{ matrix.flavor }}Release

      # Also the gate. Instruction and line sit just under where the suite actually is — 96.4 and
      # 99.6 — so they catch a regression without tracking noise. Branch is held further back, at
      # 70 against an actual 75.7, deliberately: the Compose compiler emits a $changed bitmask
      # branch for every composable parameter and no test drives those, so the number moves when
      # a composable gains an argument rather than when testing gets worse. A floor that close to
      # the line would report that as a coverage failure. See the script's docstring.
      - name: Report coverage (${{ matrix.flavor }})
        if: always()
        run: >
          python3 .github/scripts/coverage-summary.py
          app/build/reports/coverage/test/${{ matrix.flavor }}/releaseTest/report.xml
          ${{ matrix.flavor }}
          --min-instruction=95
          --min-line=99
          --min-branch=70

      - name: Build Play bundle
        if: matrix.flavor == 'play'
        run: ./gradlew --no-daemon --stacktrace bundlePlayRelease

      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.flavor }}-artifacts
          path: |
            app/build/outputs/apk/${{ matrix.flavor }}/**/*.apk
            app/build/outputs/bundle/**/*.aab
            app/build/reports/**

  # The only job that runs the code a user actually gets. Unit tests execute on the JVM against
  # unshrunk classes, so R8 never runs for them; the releaseTest build type is release plus the
  # test manifest, so androidTest installs a genuinely minified, resource-shrunk APK — which
  # needs a real Android runtime. Hence an emulator, and hence a job of its own: it is far slower
  # than the rest of CI and fails for its own reasons.
  #
  # Run twice, against the same source set. `releaseTest` is the one that matters and `debug` is
  # its control: identical tests against an unminified build, so a failure in one and not the
  # other says which half is broken without anyone having to bisect keep rules to find out.
  # Both halves of that distinction showed up the day this landed — two linkage errors that only
  # existed minified, and a backup missing its formatVersion in every build ever made. Six
  # minutes, in parallel with the minified leg, to never have to guess.
  #
  # Only the classic flavor. The flavors differ by compile-time constants in Distribution.kt and
  # one manifest overlay, not by anything R8 sees, so running both would double the slowest job
  # in the workflow to re-test identical shrinking.
  instrumented:
    runs-on: ubuntu-latest

    name: instrumented (${{ matrix.label }})

    strategy:
      fail-fast: false
      matrix:
        include:
          # `buildType` is what -Pylih.testBuildType takes, `variant` its task-name form.
          - buildType: releaseTest
            variant: ReleaseTest
            apiLevel: 34
            label: minified
          - buildType: debug
            variant: Debug
            apiLevel: 34
            label: unminified
          # And once at the minSdk floor. Everything java.time in Stats.kt and Format.kt is
          # backported there by core library desugaring rather than being the platform's, which is
          # what the L8 pinning further down app/build.gradle.kts exists for — and nothing else in
          # CI ever runs that code on a runtime that desugars it. The unit tests cannot: Robolectric
          # runs against the compile SDK, which is why lint.xml exempts src/test from NewApi.
          - buildType: releaseTest
            variant: ReleaseTest
            apiLevel: 23
            label: minified, minSdk

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Cache Android SDK components
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-37.0
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/37.0.0
          key: android-sdk-${{ runner.os }}-platform37.0-buildtools37.0.0

      - name: Install Android SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      # The runner image ships KVM but leaves it root-only, and without acceleration the emulator
      # is slow enough to make this job useless.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # releaseTest inherits release's signing config, and a release build with no
      # ANDROID_SIGNING_* in the environment is deliberately left unsigned — that is what keeps
      # the F-Droid build reproducible, see docs/fdroid.md — while an unsigned APK will not
      # install. So the job makes a key it throws away. AGP signs the androidTest APK with the
      # tested variant's config, so both sides match and the instrumentation is allowed to attach
      # to the app's process; the real signing key is never involved.
      #
      # Unconditional rather than skipped on the debug leg, which signs itself with AGP's debug
      # key and never reads these: one step that always runs beats a conditional whose two sides
      # would then have to be kept in step with each other.
      - name: Generate a throwaway signing key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/instrumented.keystore" \
            -storepass instrumented -keypass instrumented -alias instrumented \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname 'CN=ylih instrumented tests, O=throwaway'

      - name: Instrumented tests on the ${{ matrix.label }} APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/instrumented.keystore
          ANDROID_SIGNING_STORE_PASSWORD: instrumented
          ANDROID_SIGNING_KEY_ALIAS: instrumented
          ANDROID_SIGNING_KEY_PASSWORD: instrumented
        with:
          api-level: ${{ matrix.apiLevel }}
          target: default
          arch: x86_64
          disable-animations: true
          script: >
            ./gradlew --no-daemon --stacktrace
            -Pylih.testBuildType=${{ matrix.buildType }}
            connectedClassic${{ matrix.variant }}AndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: instrumented-reports-${{ matrix.buildType }}-api${{ matrix.apiLevel }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**

  # One stable check for this whole workflow to hang the branch ruleset off.
  #
  # The ruleset required six of these contexts by name -- `build (classic, Classic)`,
  # `instrumented (minified, minSdk)` and the rest -- all of which are matrix `include` entries.
  # That drifts silently in both directions: drop a variant and every PR waits forever on a
  # context nothing reports any more, indistinguishable from CI being slow; add one and it is
  # not required, so a PR failing only the new variant still merges. `needs` follows the matrix
  # on its own, so this name is the only thing the ruleset has to know.
  #
  # `devshell` stays separately required: it lives in nix.yml and `needs` cannot cross
  # workflows. It is a single job with a fixed name and no matrix, so it cannot drift.
  #
  # `if: always()` is load-bearing. Without it this job is skipped whenever anything it needs
  # fails, and GitHub reads a skipped required check as satisfied -- turning the gate into a
  # no-op exactly when it is supposed to bite.
  all-green:
    if: always()
    needs: [listing, build, instrumented]
    runs-on: ubuntu-latest

    steps:
      - name: Check CI results
        run: |
          echo "listing=${{ needs.listing.result }}"
          echo "build=${{ needs.build.result }}"
          echo "instrumented=${{ needs.instrumented.result }}"
          [ "${{ needs.listing.result }}" = success ] \
            && [ "${{ needs.build.result }}" = success ] \
            && [ "${{ needs.instrumented.result }}" = success ]
