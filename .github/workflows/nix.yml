name: Nix dev shell

# The Android SDK closure is around a gigabyte, so this only runs when the flake itself
# changes (plus a weekly canary) rather than on every push.
on:
  push:
    branches:
      - main
      - master
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devshell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Check flake
        run: nix flake check --no-build

      - name: Enter dev shell
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            java -version
            gradle --version | grep "^Gradle"
            test -d "$ANDROID_HOME/platforms/android-37.0"
            test -d "$ANDROID_HOME/build-tools/37.0.0"
          '
