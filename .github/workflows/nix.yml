name: Nix dev shell

# The Android SDK closure is ~1GB, so the expensive part runs only on flake changes, plus a
# weekly canary.
#
# No `paths:` filter despite path-conditional work: a path-filtered workflow reports nothing, not
# even neutral, on skipped runs, so `devshell` could never be a required check without blocking
# flake-untouched PRs. It always runs and decides for itself — a checkout on unrelated PRs, green
# either way.
on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devshell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Did the flake change?
        id: flake
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # Why this runs unconditionally: the weekly canary and manual dispatch.
          if [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A first push reports an all-zero `before`; a force-push can leave a base that's no
          # longer an ancestor. Neither diffs, so build rather than assume.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE" HEAD -- flake.nix flake.lock .github/workflows/nix.yml \
             | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "flake untouched — nothing to build" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Nix
        if: steps.flake.outputs.changed == 'true'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check flake
        if: steps.flake.outputs.changed == 'true'
        run: nix flake check --no-build

      - name: Enter dev shell
        if: steps.flake.outputs.changed == 'true'
        run: |
          # $ANDROID_HOME must expand inside the dev shell, not here.
          # shellcheck disable=SC2016
          nix develop --command bash -c '
            set -euo pipefail
            java -version
            gradle --version | grep "^Gradle"
            test -d "$ANDROID_HOME/platforms/android-37.0"
            test -d "$ANDROID_HOME/build-tools/37.0.0"
          '
