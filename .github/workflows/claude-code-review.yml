name: Claude Code Review

# The reviewer for pull requests you write yourself. Agent branches are excluded, and that is
# load-bearing rather than tidiness: agent PRs are opened with AGENT_PUSH_TOKEN, so their author
# is you, so this used to fire on every one of them alongside Agent · review -- two Claude
# reviewers on the same diff, spending the same five-hour window twice for one verdict. Agent ·
# review is the merge gate and runs this same plugin as its first pass, so what was lost by
# dropping the second copy is nothing.
#
# It also cost more than tokens once the pipeline became serial. Both reviewers queue in the
# `agent-pipeline` group, and that group holds one pending run: two arrivals per push meant the
# waiting one was routinely displaced, and half the time the one displaced was the merge gate --
# whose check then never reports, so auto-merge waits on it forever.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# The pipeline-wide serial group; agent-plan.yml carries the reasoning. A review of your own pull
# request is not a pipeline stage, but it spends the window the group exists to ration.
concurrency:
  group: agent-pipeline
  cancel-in-progress: false

jobs:
  claude-review:
    if: >-
      github.event.pull_request.user.login == 'ElDavoo'
      && !startsWith(github.head_ref, 'agent/issue-')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

