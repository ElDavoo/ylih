name: Claude Code Review

# The reviewer for pull requests you write yourself. Agent branches are excluded, and that's
# load-bearing, not tidiness: agent PRs are opened with AGENT_PUSH_TOKEN, so their author is
# you, and this used to fire on every one alongside Agent · review — two Claude reviewers on the
# same diff, spending the same five-hour window twice for one verdict. Agent · review is the
# merge gate and runs this same plugin itself, so dropping the second copy loses nothing.
#
# It also cost more than tokens once the pipeline became serial. Both reviewers queue in the
# `agent-pipeline` group, which holds one pending run: two arrivals per push meant the waiting
# one was routinely displaced, and half the time that was the merge gate — whose check then
# never reports, so auto-merge waits on it forever. Excluding agent branches in the `if:` below
# didn't by itself fix that half; see the note on the job's concurrency block.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: >-
      github.event.pull_request.user.login == 'ElDavoo'
      && !startsWith(github.head_ref, 'agent/issue-')

    # The pipeline-wide serial group; agent-plan.yml has the reasoning. A review of your own
    # pull request isn't a pipeline stage, but it spends the window the group exists to ration.
    #
    # On the job rather than the workflow — the opposite of agent-fix-ci.yml, for the same
    # underlying reason. A run joins a workflow-level group before any job `if:` is evaluated, so
    # with it up there every push to an agent branch still created a run that queued, took the
    # group's single pending slot, and was then displaced — runs 33997122850 and 34009431987
    # ended `cancelled` rather than `skipped`, that signature, while the same workflow on a
    # Dependabot branch skipped in five seconds. The trigger filter agent-fix-ci.yml uses isn't
    # available here: `pull_request`'s `branches:` matches the *base* branch, and every agent
    # pull request targets main. A job skipped by its `if:` never asks for the group at all, so
    # putting it here is the filter — which works only because this workflow calls no reusable
    # workflow, the reason the group is pinned at workflow level over there.
    concurrency:
      group: agent-pipeline
      cancel-in-progress: false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

