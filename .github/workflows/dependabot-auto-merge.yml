name: Dependabot auto-merge

# Turns on GitHub's own auto-merge for Dependabot PRs. Nothing is merged here and now: the
# merge only happens once every required check on the PR is green, which is what makes this
# safe — the Android CI matrix is the gate, not this workflow.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A major bump is the one case worth reading the changelog for — Compose, AGP and
      # material3 are pinned against each other, so those land by hand.
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
