name: Dependabot auto-merge

# Turns on GitHub's own auto-merge for Dependabot PRs. Nothing is merged here and now: the
# merge only happens once every required check on the PR is green, which is what makes this
# safe — the Android CI matrix is the gate, not this workflow.
#
# A gradle PR cannot go green on its own: Dependabot bumps libs.versions.toml and leaves
# gradle/verification-metadata.xml alone, so the build refuses the new artifacts as unverified.
# `dependabot-verification-metadata.yml` is what pushes the regenerated checksums onto the branch;
# that push re-runs Android CI, and this auto-merge is then waiting for a run that can pass.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

# Every Dependabot PR, with no exception for major bumps, and that is a deliberate reversal.
# The exception used to read `update-type != 'version-update:semver-major'`, on the reasoning that
# Compose, AGP and material3 are pinned against each other and a major is worth a changelog. What
# it actually did was skip every nix PR forever: dependabot/fetch-metadata is handed two git
# commit hashes for a flake.lock bump — `e5bdc4a` to `ffb3c9b7…` — cannot read either as semver,
# and falls back to reporting semver-major. PR #15 sat green and unmerged for that reason, with
# the job reporting success because the step it was meant to run had simply been skipped.
#
# A guard that cannot tell a nixpkgs hash from an AGP 10 is not a guard, and there is no version
# string in a flake.lock for a better one to read. So the gate is CI and only CI — which here
# means lint as a hard error, a coverage floor, R8 keep invariants and the instrumented suite on
# three emulators. Bringing the exception back means restoring the two steps below this comment
# from git history, and would want a per-ecosystem condition rather than the bare one.
jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge
        run: |
          set -euo pipefail

          # GitHub refuses enablePullRequestAutoMerge on a PR that is already mergeable with every
          # required check green -- "Pull request is in clean status" -- because there is nothing
          # left to wait for. A run that lands after CI has finished hits that, and PR #15 hit it
          # from the other direction: two days green, and the one command that would have merged
          # it could no longer be asked for. Merging outright is the same outcome auto-merge would
          # have reached a moment earlier.
          #
          # Matched on the message rather than falling back on any failure, deliberately. A bare
          # `|| gh pr merge` would turn every other reason auto-merge can be refused -- a
          # permission, a protection rule -- into an immediate merge of a PR whose checks nobody
          # waited for, which is the one thing this workflow must never do.
          if ! error=$(gh pr merge --auto --squash "$PR_URL" 2>&1); then
            printf '%s\n' "$error"
            case "$error" in
              *"clean status"*) gh pr merge --squash "$PR_URL" ;;
              *) exit 1 ;;
            esac
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
