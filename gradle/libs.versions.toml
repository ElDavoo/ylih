[versions]
# Keep buildTools/compileSdk in sync with flake.nix and .github/workflows/*.yml
agp = "9.3.1"
# AGP 9 compiles Kotlin itself and rejects the standalone kotlin-android plugin. The Kotlin
# Gradle plugin these two pull onto the buildscript classpath overrides the one AGP bundles,
# so they must stay equal to each other: KSP has no release for Kotlin 2.4.x yet, which is
# what pins Kotlin here rather than at the newest release.
kotlin = "2.4.10"
ksp = "2.3.10"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
# Ahead of the BOM on purpose: Material 3 Expressive's components (ShortNavigationBar,
# ButtonGroup, MaterialShapes, LoadingIndicator) land in 1.5.0-alpha, while the BOM still pins
# the 1.4.0 stable that carries only the Expressive theme. This drags compose runtime/foundation/
# ui to 1.12.0-beta01 for the whole app — the one pre-release risk in the build, taken knowingly.
material3 = "1.5.0-alpha25"
navigationCompose = "2.9.8"
room = "2.8.4"
work = "2.11.2"
# The home-screen widgets. Stable on purpose, and two years older than everything around it:
# 1.2.0-rc01 and the 1.3.0 alphas are the only newer releases and neither is out of pre-release.
# If a Kotlin or Compose bump ever makes this fail allWarningsAsErrors, moving to 1.2.0-rc01 is
# the intended answer rather than pinning the compiler back — do not "fix" this to a stable that
# does not exist.
glance = "1.1.1"
coroutines = "1.11.0"
serialization = "1.11.0"
junit = "4.13.2"
robolectric = "4.16.1"
mockk = "1.14.3"
androidxTestCore = "1.7.0"
# The instrumented suite, which exists only to run the R8-minified build on a device.
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# Renders the real Compose UI on the JVM through Robolectric's native graphics, which is how the
# Play listing screenshots are generated without an emulator anywhere in the toolchain.
roborazzi = "1.70.0"
desugarJdkLibs = "2.1.5"
# Drives android.testCoverage.jacocoVersion; AGP's bundled default predates JDK 21 class files.
jacoco = "0.8.13"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }

androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
androidx-glance-appwidget-testing = { module = "androidx.glance:glance-appwidget-testing", version.ref = "glance" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRunner" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
android-desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
