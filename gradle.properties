org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# KSP still registers its generated sources through kotlin.sourceSets, which AGP 9's built-in
# Kotlin support rejects by default. Room's generated code is what depends on this.
android.disallowKotlinSourceSets=false
# Both that flag and the nix shell's aapt2 override are deliberate; don't warn every build.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# AGP creates unit tests only for testBuildType, which here is releaseTest — so the suite only
# ever ran against a build carrying release's BuildConfig and no applicationId suffix. Turning
# this off gives every build type its own unit test variant, which is what lets CI run the suite
# on debug as well. See app/build.gradle.kts for what that costs and why release's is switched
# back off there.
android.onlyEnableUnitTestForTheTestedBuildType=false

kotlin.code.style=official

# Without this, captureRoboImage("devices.png") writes to the module root instead of the
# directory configured in the roborazzi block. See docs/play-store.md.
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
