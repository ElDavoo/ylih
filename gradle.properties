org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# KSP still registers generated sources through kotlin.sourceSets, which AGP 9's built-in Kotlin
# support rejects by default; Room's generated code depends on this.
android.disallowKotlinSourceSets=false
# Both that flag and the nix shell's aapt2 override are deliberate; don't warn every build.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# AGP creates unit tests only for testBuildType, here releaseTest, so the suite only ran against
# a build with release's BuildConfig and no applicationId suffix. Turning this off gives every
# build type its own unit test variant, letting CI run the suite on debug too. See
# app/build.gradle.kts for the cost, and why release's is switched back off there.
android.onlyEnableUnitTestForTheTestedBuildType=false

kotlin.code.style=official

# Without this, captureRoboImage("devices.png") writes to the module root instead of the
# roborazzi block's configured directory. See docs/play-store.md.
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
