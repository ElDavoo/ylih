org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# KSP still registers its generated sources through kotlin.sourceSets, which AGP 9's built-in
# Kotlin support rejects by default. Room's generated code is what depends on this.
android.disallowKotlinSourceSets=false
# Both that flag and the nix shell's aapt2 override are deliberate; don't warn every build.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

kotlin.code.style=official
